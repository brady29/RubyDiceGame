<svg xmlns="http://www.w3.org/2000/svg" width="910" height="818" viewBox="0 0 910 818" font-family="Helvetica, Arial, sans-serif">
<style>
.box{fill:#eef3fb;stroke:#2b4a7a;stroke-width:1.5} .p{font-size:13px;font-weight:bold;fill:#1b2a44}
.life{stroke:#8a96a8;stroke-dasharray:5 4} .msg{stroke:#222;fill:none;stroke-width:1.3}
.ret{stroke:#555;stroke-dasharray:6 4;stroke-width:1.2} .l{font-size:11.5px;fill:#111}
.frag{fill:none;stroke:#7a5a2b;stroke-width:1.2} .fk{font-size:11px;font-weight:bold;fill:#7a5a2b}
.g{font-size:11px;font-style:italic;fill:#7a5a2b} .dash{stroke:#7a5a2b;stroke-dasharray:4 3}
.t{font-size:17px;font-weight:bold;fill:#111} .s{font-size:12px;fill:#444}
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222"/></marker>
<marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8" fill="none" stroke="#555"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="20" y="32" class="t">SD2 - Use Case: Take Turn</text>
<text x="20" y="54" class="s">Purpose: let the current player roll until a 2 or 5 appears, then pass play on.</text>
<text x="20" y="72" class="s">Source: generated by Claude (Anthropic AI assistant) for this assignment.</text>
<line x1="105.0" y1="130" x2="105.0" y2="803" class="life"/>
