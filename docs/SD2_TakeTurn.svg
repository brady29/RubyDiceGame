<path d="M455.0,588 h34 v16 h-34" class="msg" marker-end="url(#a)"/>
<text x="495.0" y="600" class="l">move to next active player</text>
<path d="M455.0,650 h34 v16 h-34" class="msg" marker-end="url(#a)"/>
<text x="495.0" y="662" class="l">remove player from active players</text>
