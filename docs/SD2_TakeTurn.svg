<text x="455.0" y="452" class="l" text-anchor="middle">yield -&gt; roll_made(result)</text>
<rect x="12" y="364" width="886" height="132" class="frag"/>
<path d="M12,382 h44 l8,-8 v-10" class="frag"/>
<text x="18" y="377" class="fk">loop</text>
